# Portfel Analizi — main configuration.
# Secrets live in .env, never here.

app:
  mode: personal            # personal | commercial  (overridable by APP_MODE in .env)
  brand: "Portfel Analizi"
  default_language: az
  default_base_currency: USD
  supported_currencies: [USD, EUR, GBP, AZN]

data:
  # investing.com is NEVER queried programmatically. Symbols are only identifiers.
  provider: yahoo           # yahoo (personal only) | api:<name> (future, licensed)
  exchange_suffixes:        # exchange code -> Yahoo suffix
    NASDAQ: ""
    NYSE: ""
    NYSEARCA: ""
    AMEX: ""
    LSE: ".L"
    XETRA: ".DE"
    EPA: ".PA"
  yahoo_exchange_codes:     # Yahoo exchange codes -> our exchange code
    NMS: NASDAQ
    NGM: NASDAQ
    NCM: NASDAQ
    NYQ: NYSE
    PCX: NYSEARCA
    ASE: AMEX
    LSE: LSE
    GER: XETRA
    PAR: EPA
  exchange_calendars:       # our exchange code -> exchange_calendars name
    NASDAQ: XNYS
    NYSE: XNYS
    NYSEARCA: XNYS
    AMEX: XNYS
    LSE: XLON
    XETRA: XETR
    EPA: XPAR
  exchange_currency:        # shown for search candidates; confirmed from the provider on selection
    NASDAQ: USD
    NYSE: USD
    NYSEARCA: USD
    AMEX: USD
    LSE: GBP
    XETRA: EUR
    EPA: EUR
  exchange_mic:
    NASDAQ: XNAS
    NYSE: XNYS
    NYSEARCA: ARCX
    AMEX: XASE
    LSE: XLON
    XETRA: XETR
    EPA: XPAR
  market_index:             # exchange code -> benchmark index
    NASDAQ: "^GSPC"
    NYSE: "^GSPC"
    NYSEARCA: "^GSPC"
    AMEX: "^GSPC"
    LSE: "^FTSE"
    XETRA: "^GDAXI"
    EPA: "^FCHI"
  factor_tickers:             # stress-test factors (the market factor is the portfolio's own index)
    rates: "^TNX"             # US 10y yield; a level factor: shocks are in percentage points (1.0 = +100 bp)
    oil: "BZ=F"               # Brent
    usd: "DX-Y.NYB"           # US dollar index
    gold: "GC=F"
    vix: "^VIX"               # implied volatility (fear gauge)
  level_factors: [rates]      # factors modelled in changes; all others in log returns
  fx_fallback:              # used when Yahoo has no FX ticker
    USDAZN: 1.70
  rate_limit:
    min_interval_seconds: 1.5
    max_retries: 3
    backoff_base_seconds: 2.0
  refresh_after_hour_utc: 22  # do not refresh a symbol more than once per day after this hour
  min_history_years_stress: 15
  estimation_window_years: 5
  min_estimation_years: 2
  quality:
    mad_z_threshold: 12.0
    stale_run_days: 10
    split_jump_ratio: 0.45
    min_trading_share: 0.80   # below: "rarely traded" warning (share of business days with volume in the last year)

portfolio:
  fractional_decimals: 4
  cost_method: fifo         # fifo | average
  price_tolerance_pct: 2.0  # warn if entered price outside [Low, High] by more than this
  risk_profiles:            # 3-month CVaR95 limits (fraction of value)
    conservative: 0.08
    moderate: 0.15
    aggressive: 0.25
  default_risk_profile: moderate
  whatif_max_trades: 20     # hypothetical trades in one what-if scenario
  annualize_min_days: 91      # lots held shorter than this show no annualised return

model:
  horizon_days: 63
  scenarios: 10000
  scenarios_max: 50000
  memory_budget_bytes: 1200000000   # caps adaptive S for large portfolios (S x 63 x N float32 arrays)
  mc_rel_error_target: 0.01
  param_sets: 200
  seed: 20261027
  sample_paths: 8
  history_days: 252           # past value shown before the fan chart (6-12 months)
  percentiles: [5, 25, 50, 75, 95]
  garch:
    vol_models: [GARCH, GJR, EGARCH]
    dists: [normal, t, skewt]
    default: [GJR, skewt]
    scale: 100.0
  ewma_lambda: 0.94
  break_policy:               # PROMPT.md 6.1: variance breaks shape the estimation window
    enabled: true
    trim: 0.15                # candidate break dates within [15%, 85%] of the window
    test_spec: [GJR, t]       # specification used for the LR when the selection fell back to EWMA
  short_history_years: 2.0
  # a series that is mostly carried-forward prices (illiquid listing) breaks GARCH estimation: the rare
  # trading days look like huge shocks and the fit can explode in simulation; such instruments get EWMA
  max_zero_return_share: 0.20
  # physical bound on one simulated day (log return; 0.7 = -50% / +100%) and on daily volatility:
  # a model that would go beyond it is mis-specified, not informative, and must never yield inf/NaN
  max_daily_log_return: 0.7
  proxy_history_months: 6
  dcc:
    use_engle_sheppard: true
    es_lags: 5
  loss_thresholds: [0.05, 0.10, 0.20]
  drift:
    mrp: 0.05                 # default market risk premium (annual)
    mrp_by_currency:          # admin can override per currency
      USD: 0.05
      EUR: 0.05
      GBP: 0.05
      AZN: 0.05
    rf:                       # fallback annual risk-free rates by currency
      USD: 0.04
      EUR: 0.025
      GBP: 0.04
      AZN: 0.07
    rf_ticker:
      USD: "^IRX"

stress:
  # Historical: each holding's actual return over the window (total-return prices, base currency); a holding
  # without data then gets beta x the market index move. Windows are peak-to-trough of the S&P 500 unless noted.
  historical:
    - {name: "1929 krax", start: "1929-10-23", end: "1929-11-13", group: "böhran"}
    - {name: "1973–74 neft böhranı", start: "1973-01-11", end: "1974-10-03", group: "böhran"}
    - {name: "1987 Qara Bazar ertəsi", start: "1987-10-13", end: "1987-10-19", group: "krax"}
    - {name: "1990 Körfəz böhranı", start: "1990-07-16", end: "1990-10-11", group: "geosiyasi"}
    - {name: "1997 Asiya böhranı", start: "1997-10-07", end: "1997-10-27", group: "böhran"}
    - {name: "1998 Rusiya defoltu / LTCM", start: "1998-07-17", end: "1998-08-31", group: "böhran"}
    - {name: "Dot-com köpüyünün partlaması", start: "2000-03-24", end: "2002-10-09", group: "böhran"}
    - {name: "11 sentyabr 2001", start: "2001-09-10", end: "2001-09-21", group: "geosiyasi"}
    - {name: "2002 mühasibat skandalları", start: "2002-03-19", end: "2002-07-23", group: "böhran"}
    - {name: "2007–09 qlobal maliyyə böhranı", start: "2007-10-09", end: "2009-03-09", group: "böhran"}
    - {name: "Lehman Brothers iflası", start: "2008-09-12", end: "2008-11-20", group: "krax"}
    - {name: "2008 Q4", start: "2008-09-30", end: "2008-12-31", group: "böhran"}
    - {name: "2010 Avro borc böhranı / flash crash", start: "2010-04-23", end: "2010-07-02", group: "böhran"}
    - {name: "2011 ABŞ reytinqinin endirilməsi", start: "2011-07-22", end: "2011-10-03", group: "böhran"}
    - {name: "2013 taper tantrum", start: "2013-05-21", end: "2013-06-24", group: "faiz"}
    - {name: "2015 Çin devalvasiyası", start: "2015-08-17", end: "2015-08-25", group: "krax"}
    - {name: "2016 neft və Çin narahatlığı", start: "2015-12-29", end: "2016-02-11", group: "böhran"}
    - {name: "Brexit referendumu", start: "2016-06-23", end: "2016-06-27", group: "geosiyasi"}
    - {name: "2018 fevral — volatillik şoku", start: "2018-01-26", end: "2018-02-08", group: "krax"}
    - {name: "2018 Q4 satışı", start: "2018-09-20", end: "2018-12-24", group: "faiz"}
    - {name: "COVID 2020", start: "2020-02-19", end: "2020-03-23", group: "krax"}
    - {name: "2020 sentyabr texnologiya satışı", start: "2020-09-02", end: "2020-09-23", group: "sektor"}
    - {name: "2022 faiz şoku (ayı bazarı)", start: "2022-01-03", end: "2022-10-12", group: "faiz"}
    - {name: "2023 regional banklar (SVB)", start: "2023-03-08", end: "2023-03-13", group: "sektor"}
    - {name: "2023 yüksək faizlər", start: "2023-07-31", end: "2023-10-27", group: "faiz"}
    - {name: "2024 yen carry-trade çözülməsi", start: "2024-07-16", end: "2024-08-05", group: "krax"}
    - {name: "2025 aprel tarifləri", start: "2025-04-02", end: "2025-04-08", group: "geosiyasi"}
    # rebounds: positions that lose when the market rallies (hedges, shorts of risk) show up here
    - {name: "2009 bərpası", start: "2009-03-09", end: "2009-09-30", group: "ralli"}
    - {name: "2020 bərpası", start: "2020-03-23", end: "2020-06-08", group: "ralli"}
    - {name: "2025 tarif fasiləsi", start: "2025-04-08", end: "2025-04-09", group: "ralli"}
  # Hypothetical: shocks to factors (market = the portfolio's index; rates in percentage points; others as
  # simple returns). Each holding moves by its multi-factor betas (estimation window, HAC OLS), compounded.
  hypothetical:
    - {name: "Bazar −10%", shocks: {market: -0.10}, group: "bazar"}
    - {name: "Bazar −20%", shocks: {market: -0.20}, group: "bazar"}
    - {name: "Bazar −30%", shocks: {market: -0.30}, group: "bazar"}
    - {name: "Bazar −40%", shocks: {market: -0.40}, group: "bazar"}
    - {name: "Bazar +10%", shocks: {market: 0.10}, group: "bazar"}
    - {name: "Bazar +20%", shocks: {market: 0.20}, group: "bazar"}
    - {name: "Faiz +50 bp", shocks: {rates: 0.5}, group: "faiz"}
    - {name: "Faiz +100 bp", shocks: {rates: 1.0}, group: "faiz"}
    - {name: "Faiz +200 bp", shocks: {rates: 2.0}, group: "faiz"}
    - {name: "Faiz −100 bp", shocks: {rates: -1.0}, group: "faiz"}
    - {name: "Neft −30%", shocks: {oil: -0.30}, group: "əmtəə"}
    - {name: "Neft −50%", shocks: {oil: -0.50}, group: "əmtəə"}
    - {name: "Neft +30%", shocks: {oil: 0.30}, group: "əmtəə"}
    - {name: "Neft +50%", shocks: {oil: 0.50}, group: "əmtəə"}
    - {name: "Dollar +10%", shocks: {usd: 0.10}, group: "valyuta"}
    - {name: "Dollar −10%", shocks: {usd: -0.10}, group: "valyuta"}
    - {name: "Qızıl +20%", shocks: {gold: 0.20}, group: "əmtəə"}
    - {name: "Qorxu indeksi (VIX) ikiqat", shocks: {vix: 1.0}, group: "bazar"}
    - {name: "Stagflyasiya", shocks: {market: -0.15, rates: 1.5, oil: 0.40, usd: 0.05}, group: "makro"}
    - {name: "Resessiya", shocks: {market: -0.25, rates: -1.0, oil: -0.35, vix: 1.0}, group: "makro"}
    - {name: "Maliyyə böhranı", shocks: {market: -0.35, rates: -1.0, oil: -0.40, usd: 0.10, vix: 1.5}, group: "makro"}
    - {name: "Faiz şoku (2022 tipli)", shocks: {market: -0.20, rates: 2.0, usd: 0.10}, group: "makro"}
    - {name: "Geosiyasi neft şoku", shocks: {market: -0.10, oil: 0.60, gold: 0.15, vix: 0.6}, group: "makro"}
    - {name: "Texnologiya köpüyünün partlaması", shocks: {market: -0.30, rates: -0.5, vix: 0.8}, group: "makro"}
    - {name: "Dollar böhranı", shocks: {usd: -0.15, gold: 0.20, rates: 0.5}, group: "makro"}
    - {name: "Yumşaq eniş ralli", shocks: {market: 0.15, rates: -0.5, vix: -0.30}, group: "makro"}

validation:
  alpha: 0.05
  backtest_months: 24
  backtest_refit_every_months: 1
  var_levels: [0.95, 0.99]
  es_level: 0.975
  interval_levels: [0.50, 0.80, 0.90, 0.95, 0.98]
  gate_interval_levels: [0.50, 0.90]   # gate 5 and per-instrument 63-day coverage
  mcs_size: 0.10
  bootstrap_reps: 500
  block_size: 21
  backtest_scenarios: 2000
  one_step_samples: 2000     # FHS draws for each daily one-step forecast
  hs_window: 250             # historical-simulation competitor window (days)
  ewma_cov_window: 500       # EWMA-normal competitor covariance window (days)
  har_lags: [1, 5, 22]       # HAR competitor: daily, weekly, monthly
  dq_lags: 4                 # Engle-Manganelli DQ lags; also Mincer-Zarnowitz HAC lags
  aci_gamma: 0.01            # adaptive conformal step size
  aci_tolerance: 0.10        # |ACI coverage - nominal| for "passes after conformal calibration"
  kupiec_power_alt: 0.02     # alternative exceedance rate for the reported power of Kupiec 99%
  power_reps: 2000
  ljung_box_lags: [5, 10, 20]
  fallback_spec: {vol: GJR, dist: skewt}   # gate-failure step 1: the specification tried next

recommend:
  risk_share_ratio: 1.5
  max_position_weight: 0.20
  max_cluster_weight: 0.40
  cluster_corr_threshold: 0.5
  disclaimer: "Bu, investisiya məsləhəti deyil; qərar verməyə kömək edən təhlildir. Nəticələr zəmanət deyil, ehtimaldır."
  disclaimer_en: "This is not investment advice; it is analysis to help you decide. Results are probabilities, not guarantees."

insights:                     # CIO / CRO views of a run; status thresholds as fractions (green below amber)
  limit_use_amber: 0.80       # CVaR95 / risk limit (red above 1)
  stress_limit_red: 2.0       # worst stress loss / risk limit (amber above 1)
  vol_regime_amber: 1.20      # current / long-run volatility of the portfolio
  vol_regime_red: 1.50
  corr_amber: 0.50            # average pairwise correlation today
  corr_red: 0.70
  top3_risk_amber: 0.60       # share of CVaR95 carried by the three largest contributors
  top3_risk_red: 0.80
  idio_share_amber: 0.50      # share of variance the market does not explain (not paid for under CAPM)
  idio_share_red: 0.70
  drawdown_level: 0.10        # KRI: probability of touching this loss at some point in the period
  drawdown_touch_amber: 0.25
  drawdown_touch_red: 0.40
  liquidity_participation: 0.20   # share of average daily volume that can be sold per day
  liquidity_adv_days: 20
  liquidity_days_amber: 1.0
  liquidity_days_red: 5.0
  efficiency_low: 0.67        # expected-return share / risk share of a position
  efficiency_high: 1.50
  hedge_min_share: 0.02        # a position is a hedge only if it lowers CVaR95 by at least this share
  hidden_tail_level: 0.98     # unreliable model: the UI shows no VaR/CVaR or quantile beyond this level
  # top position weight: amber above recommend.max_position_weight, red above recommend.max_cluster_weight

report:                       # client PDF report
  history_days: 126           # past value shown before the forecast in the chart (~6 months)
  stress_rows: 25             # worst stress scenarios listed in the PDF (all are in the app)
  # Unicode fonts (Azerbaijani letters), first file that exists is used
  font_regular: ["C:/Windows/Fonts/arial.ttf", "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf", "/Library/Fonts/Arial.ttf"]
  font_bold: ["C:/Windows/Fonts/arialbd.ttf", "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", "/Library/Fonts/Arial Bold.ttf"]

features:
  csv_import: true          # forced off in commercial mode
  signal_model: false       # stage B, gated
  rl: false                 # stage C, gated

security:
  open_registration: true    # false on an internet-facing server: only the first account (admin) registers
  rate_limit_per_minute: 120
  login_rate_limit_per_minute: 10
  session_days: 7
  password_reset_minutes: 30     # reset link lifetime; in personal mode the link is printed to the server console
  invite_hours: 72               # lifetime of the link in an admin's invitation e-mail
  password_min_length: 10
  password_min_unique_chars: 5
  max_failed_logins: 5           # failed attempts before the account is locked
  lockout_minutes: 15            # first lock; doubles on each further lock, capped below
  lockout_max_minutes: 1440

jobs:
  poll_interval_seconds: 1.0
  sqlite_retries: 8
  monitor_interval_minutes: 60   # 90%-band monitoring of the latest runs (PROMPT.md 7.1)
  max_workers: 3                 # process pool for model fitting; raise on machines with more RAM (~200 MB each)
